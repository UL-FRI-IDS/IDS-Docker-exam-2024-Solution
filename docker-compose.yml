version: '3.9'

services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: passpass
    ports:
      - 5432:5432
    volumes:
      - ./data/dump.sql:/docker-entrypoint-initdb.d/dump.sql

  adminer:
    depends_on:
      - db
    image: adminer
    restart: always
    ports:
      - 8080:8080
