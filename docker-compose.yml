services:
  dbserver:
    image: postgres:17.2
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ulfriids
    ports:
      - 5432:5432
    volumes:
      - ./data/dump.sql:/docker-entrypoint-initdb.d/dump.sql
      - ./pgdata:/var/lib/postgresql/data

  dbgui:
    image: adminer:latest
    restart: always
    ports:
      - 6836:8080
